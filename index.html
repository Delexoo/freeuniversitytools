<!DOCTYPE html>
<html lang="en" class="page-home">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Search for thousands of free tools.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="doc/FreeUniversityTools.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Free Uni Tools">
  <title>Free University Tools</title>
  <link rel="icon" type="image/png" href="doc/FreeUniversityTools.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/home-search.css">
  <link rel="stylesheet" href="css/mobile-graphics.css" media="(max-width: 768px)">
</head>
<body class="page-home-body">
  <header class="header header--tools home-header" id="header">
      <div class="header-inner">
      <a href="index.html" class="logo" aria-label="Free University Tools home">
        <span class="logo-free">free</span><span class="logo-university">university</span><span class="logo-tools">tools</span>
      </a>
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu">☰</button>
        <nav class="nav" id="mainNav">
        <a href="index.html" class="nav-link active">Search</a>
          <div class="nav-dropdown" id="navDropdown">
          <button type="button" class="desktop-dropdown-toggle" id="desktopDropdownToggle" aria-label="More menu" aria-expanded="false">☰</button>
            <button class="nav-dropdown-btn">More ▼</button>
            <div class="nav-dropdown-content">
            <a href="about.html" class="nav-link">About</a>
            <a href="policy.html" class="nav-link">Terms</a>
            </div>
          </div>
        <a href="https://buy.stripe.com/9B63cu3RE2ouaKgcHLcjS00" target="_blank" class="btn-donate">Donate</a>
        </nav>
      </div>
    </header>

  <main class="home-main">
    <section class="home-hero" aria-label="Search">
      <div class="home-hero-inner">
        <h1 class="home-brand">
          <span class="home-brand-free">free</span><span class="home-brand-rest">universitytools</span>
        </h1>
        <p class="home-lede">Search for thousands of free tools.</p>

        <form class="home-search" id="homeSearchForm" role="search" action="#results">
          <label class="visually-hidden" for="homeSearch">Search tools</label>
          <div class="home-search-shell">
            <div class="home-search-box">
              <input
                id="homeSearch"
                class="home-search-input"
                type="search"
                placeholder="Search tools…"
                aria-label="Search tools"
                autocomplete="off"
                enterkeyhint="search"
                spellcheck="false"
              >
              <button type="button" class="home-btn home-btn--ghost home-search-clear" id="homeSearchClear" aria-label="Clear" hidden>Clear</button>
              <button type="submit" class="home-btn home-btn--solid" id="homeSearchGo">Search</button>
            </div>
            <div class="home-suggestions" id="homeSuggestions" role="listbox" aria-label="Suggestions"></div>
          </div>
        </form>

        <div class="home-controls">
          <div class="home-filters-row">
            <div class="home-filters" id="homeChips" role="group" aria-label="Pricing filter">
              <span class="home-filters-thumb" id="homeFiltersThumb" aria-hidden="true"></span>
              <button type="button" class="home-filter is-active" data-price="all"><span class="home-filter-label">All</span><span class="home-filter-count" data-price-count="all">…</span></button>
              <button type="button" class="home-filter" data-price="free"><span class="home-filter-label">Free</span><span class="home-filter-count" data-price-count="free">…</span></button>
              <button type="button" class="home-filter" data-price="free-tier"><span class="home-filter-label">Free Tier</span><span class="home-filter-count" data-price-count="free-tier">…</span></button>
              <button type="button" class="home-filter" data-price="limited"><span class="home-filter-label">Limited</span><span class="home-filter-count" data-price-count="limited">…</span></button>
              <button type="button" class="home-filter" data-price="paid"><span class="home-filter-label">Paid</span><span class="home-filter-count" data-price-count="paid">…</span></button>
            </div>
          </div>

          <div class="home-filters-row">
            <div class="home-filters home-filters--kinds" id="homeKindChips" role="group" aria-label="Type filter">
              <span class="home-filters-thumb" id="homeKindThumb" aria-hidden="true"></span>
              <button type="button" class="home-filter is-active" data-kind="all">All types</button>
              <button type="button" class="home-filter" data-kind="website">Website</button>
              <button type="button" class="home-filter" data-kind="ai">AI</button>
              <button type="button" class="home-filter" data-kind="app">App</button>
              <button type="button" class="home-filter" data-kind="extension">Extension</button>
              <button type="button" class="home-filter" data-kind="github">GitHub</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="home-section" aria-labelledby="catsHeading">
      <header class="home-section-head">
        <h2 id="catsHeading">Categories</h2>
        <span class="home-cat-meta" id="homeCatMeta"></span>
      </header>
      <div class="home-cat-grid" id="homeCategories"></div>
      <button type="button" class="home-btn home-btn--ghost home-cats-more" id="homeCatsMore" hidden>Show more categories</button>
    </section>

    <section class="home-section" id="results" aria-labelledby="homeResultsHead">
      <header class="home-section-head">
        <h2 id="homeResultsHead">Tools</h2>
      </header>
      <div class="home-loading" id="homeLoading">Loading…</div>
      <div class="home-results" id="homeResults"></div>
      <button type="button" class="home-btn home-btn--ghost home-more" id="homeMore" hidden>Show more</button>
    </section>

    <footer class="home-foot">
      <a href="policy.html">Terms</a>
      <span aria-hidden="true">·</span>
      <span>Educational listings only</span>
    </footer>
  </main>

  <script defer src="js/common.js"></script>
  <script defer src="js/home-search.js"></script>
</body>
</html>
